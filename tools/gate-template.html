<!doctype html>
<html lang="zh-CN" class="is-gated">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="受密码保护的私人页面。" />
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
    <meta name="referrer" content="no-referrer" />
    <title>Private · emo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='11' fill='%23d97757'/%3E%3C/svg%3E" />
    <link rel="modulepreload" href="assets/vendor/three.module.js" />
    <link rel="preload" href="assets/vendor/lucide.min.js" as="script" />
    <link rel="stylesheet" href="styles.css?v=8" />
  </head>
  <body>
    <main
      class="access-gate"
      role="dialog"
      aria-modal="true"
      aria-labelledby="access-title"
      aria-describedby="access-description"
      data-access-gate
    >
      <div class="access-gate__shell">
        <div class="access-gate__identity" aria-label="emo private site">
          <span class="access-gate__mark" aria-hidden="true"></span>
          <strong>emo</strong>
          <span class="access-gate__badge">PRIVATE</span>
        </div>

        <section class="access-gate__panel">
          <p class="access-gate__eyebrow">Private access</p>
          <h1 id="access-title">请输入访问密码</h1>
          <p class="access-gate__lede" id="access-description">此页面仅向受邀访客开放。验证通过后，本页会在你的浏览器中解密。</p>

          <form class="access-form" data-access-form novalidate>
            <label for="access-password">访问密码</label>
            <div class="access-form__field">
              <input
                id="access-password"
                name="password"
                type="password"
                autocomplete="current-password"
                autocapitalize="none"
                autocorrect="off"
                spellcheck="false"
                enterkeyhint="go"
                required
                aria-describedby="access-status"
                data-access-password
              />
              <button class="access-form__reveal" type="button" aria-controls="access-password" aria-pressed="false" data-access-reveal>
                显示
              </button>
            </div>

            <p class="access-form__status" id="access-status" role="status" aria-live="polite" data-access-status></p>

            <button class="access-form__submit" type="submit" data-access-submit>
              <span data-access-submit-label>解锁访问</span>
              <span class="access-form__spinner" aria-hidden="true"></span>
            </button>
          </form>
        </section>

        <p class="access-gate__note">密码与解密密钥不会写入本地存储；刷新或关闭页面后需重新验证。</p>
      </div>
    </main>

    <noscript>
      <div class="access-gate__noscript" role="alert">此页面需要启用 JavaScript 才能验证密码。</div>
    </noscript>

    <script id="protected-payload" type="application/json">__PROTECTED_PAYLOAD__</script>
    <script defer src="script.js?v=8"></script>
  </body>
</html>
