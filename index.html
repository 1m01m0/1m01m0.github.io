<html lang="en" class="is-gated">
  <head>
    <meta charset="utf-8" />

    <meta name="description" content="Password-protected academic portfolio." />
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />

    <title>Portfolio access · emo</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='11' fill='%2322405e'/%3E%3C/svg%3E" />

  <body>
    <main
      class="access-gate"
      role="dialog"
      aria-modal="true"
      aria-labelledby="access-title"
      aria-describedby="access-description"
      data-access-gate
    >
      <div class="access-gate__shell">
        <div class="access-gate__identity" aria-label="emo academic portfolio">
          <span class="access-gate__mark" aria-hidden="true"></span>
          <span class="access-gate__wordmark">emo</span>
          <span class="access-gate__badge">Private access</span>
        </div>

        <section class="access-gate__panel">
          <p class="access-gate__eyebrow">Academic portfolio</p>
          <h1 id="access-title">Enter access password</h1>
          <p class="access-gate__lede" id="access-description">This portfolio is shared with invited reviewers. Its contents are decrypted only in your browser.</p>

          <form class="access-form" data-access-form novalidate>
            <label for="access-password">Password</label>
            <div class="access-form__field">
              <input
                id="access-password"
                name="password"
                type="password"
                autocomplete="current-password"
                autocapitalize="none"
                autocorrect="off"
                spellcheck="false"
                enterkeyhint="go"
                required
                aria-describedby="access-status"
                data-access-password
              />
              <button class="access-form__reveal" type="button" aria-controls="access-password" aria-pressed="false" data-access-reveal>
                Show
              </button>
            </div>

            <p class="access-form__status" id="access-status" role="status" aria-live="polite" data-access-status></p>

            <button class="access-form__submit" type="submit" data-access-submit>
              <span data-access-submit-label>Unlock portfolio</span>
              <span class="access-form__spinner" aria-hidden="true"></span>
            </button>
          </form>
        </section>

        <p class="access-gate__note">The password and decryption key are not saved to browser storage. Access resets when this page is closed or refreshed.</p>
      </div>
    </main>

    <noscript>
      <div class="access-gate__noscript" role="alert">JavaScript is required to verify the password and open this portfolio.</div>
