<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>emo · 素材一览</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; padding: 48px 24px; background: #f7f5ef; color: #202a33; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; line-height: 1.7; }
      main { max-width: 1120px; margin: auto; }
      header { border-bottom: 1px solid #b7b09e; padding-bottom: 24px; margin-bottom: 32px; }
      header p { margin: 0; color: #626e78; font-size: 14px; }
      h1 { margin: 6px 0 12px; font: 400 clamp(32px, 5vw, 48px)/1.2 "Iowan Old Style", "Songti SC", Georgia, serif; color: #22405e; }
      .gallery { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 32px 24px; }
      figure { margin: 0; min-width: 0; }
      .art { display: grid; place-items: center; aspect-ratio: 4 / 3; overflow: hidden; }
      img { display: block; width: auto; height: auto; max-width: 100%; max-height: 100%; object-fit: contain; mix-blend-mode: darken; mask-image: linear-gradient(to right, transparent, #000 18%, #000 82%, transparent), linear-gradient(to bottom, transparent, #000 14%, #000 86%, transparent); mask-composite: intersect; }
      .portrait img { width: 62.5%; }
      .dark { background: #193149; }
      .dark img { mix-blend-mode: normal; }
      figcaption { padding: 16px 0 12px; border-bottom: 1px solid #dedbd2; }
      h2 { margin: 0 0 4px; font-size: 16px; font-weight: 500; }
      figcaption p { margin: 0 0 8px; font-size: 13px; color: #626e78; }
      a { color: #8a4b32; font-size: 13px; text-underline-offset: 4px; display: inline-flex; min-height: 44px; align-items: center; margin-right: 18px; }
      a:focus-visible { outline: 2px solid #22405e; outline-offset: 4px; }
      footer { margin-top: 40px; font-size: 13px; color: #626e78; }
      @media (max-width: 850px) { .gallery { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
      @media (max-width: 520px) { body { padding: 28px 20px; } .gallery { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <main>

      <div class="gallery">
        <figure><div class="art portrait"><img src="quiet-study.webp" alt="书本和植物旁的赤陶色拱门" /></div><figcaption><h2>01 · 思想之门</h2><p>入口页 / 主视觉</p><a href="quiet-study-source.png">高清原图</a><a href="quiet-study.webp">网页轻量版</a></figcaption></figure>
        <figure><div class="art"><img src="study-vignette.webp" alt="打开的书本、几何构件和轨道线" /></div><figcaption><h2>02 · 学习与构建</h2><p>个人简介 / 开篇插画</p><a href="study-vignette-source.png">高清原图</a><a href="study-vignette.webp">网页轻量版</a></figcaption></figure>
        <figure><div class="art"><img src="research-observation.webp" alt="放大镜与植物组成的观察主题插画" /></div><figcaption><h2>03 · 观察与探索</h2><p>研究方向 / 展开的研究说明</p><a href="research-observation-source.png">高清原图</a><a href="research-observation.webp">网页轻量版</a></figcaption></figure>
        <figure><div class="art"><img src="projects-assembly.webp" alt="几何构件搭成低矮的小桥" /></div><figcaption><h2>04 · 从零搭建</h2><p>项目展示 / 横向插画</p><a href="projects-assembly-source.png">高清原图</a><a href="projects-assembly.webp">网页轻量版</a></figcaption></figure>
        <figure><div class="art"><img src="learning-library.webp" alt="阶梯状书本、铅笔与植物枝叶" /></div><figcaption><h2>05 · 拾级而上</h2><p>学习经历 / 小幅插画</p><a href="learning-library-source.png">高清原图</a><a href="learning-library.webp">网页轻量版</a></figcaption></figure>

      </div>
      <footer>原创 AI 辅助插画 · 装饰性视觉素材 <a href="../../index.html">返回网站预览</a></footer>

  </body>
</html>
